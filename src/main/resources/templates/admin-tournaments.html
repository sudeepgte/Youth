<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Tournaments | Youthian Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            --text-primary: #0f172a;
            --text-secondary: #334155;
        }
        body { background: var(--bg-gradient) !important; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        .main-container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        
        .btn-back {
            display: inline-flex; align-items: center; gap: 8px; color: #475569; text-decoration: none; font-weight: 700; margin-bottom: 25px; background: white; padding: 10px 20px; border-radius: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.2s;
        }
        .btn-back:hover { transform: translateX(-3px); color: #0f172a; box-shadow: 0 6px 12px rgba(0,0,0,0.08); }
        
        .table-card {
            background: #ffffff; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; padding: 15px 20px; text-align: left; font-weight: 700; color: #475569; font-size: 13px; text-transform: uppercase; border-bottom: 2px solid #e2e8f0; }
        td { padding: 15px 20px; border-bottom: 1px solid #f1f5f9; color: #334155; font-size: 14px; }
        tr:hover { background: #f8fafc; }
        
        .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; display: inline-block; }
        .status-DRAFT { background: #f1f5f9; color: #64748b; }
        .status-REGISTRATION_OPEN { background: #dcfce7; color: #16a34a; }
        .status-IN_PROGRESS { background: #fee2e2; color: #dc2626; }
        .status-COMPLETED { background: #fef9c3; color: #ca8a04; }
        
        .btn-action { padding: 8px 15px; border-radius: 10px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; font-size: 13px; transition: 0.2s; }
        .btn-edit { background: white; color: #3b82f6; border: 1px solid #3b82f6; }
        .btn-edit:hover { background: #3b82f6; color: white; }
        
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .btn-create { background: white; color: #10B981; border: 2px solid #10B981; padding: 12px 24px; border-radius: 12px; font-weight: bold; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-create:hover { background: #10B981; color: white; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(16,185,129,0.3); }
        /* Modal Styles */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .mode-modal { background: white; padding: 40px; border-radius: 20px; text-align: center; max-width: 500px; width: 90%; }
        .mode-modal h2 { margin-top: 0; color: #0f172a; font-weight: 900; }
        .mode-modal p { color: #64748b; margin-bottom: 30px; }
        .mode-options { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .mode-card { border: 2px solid #e2e8f0; border-radius: 15px; padding: 30px 20px; cursor: pointer; transition: 0.2s; text-decoration: none; color: inherit; display: block; }
        .mode-card:hover { border-color: #3b82f6; transform: translateY(-5px); box-shadow: 0 10px 20px rgba(59, 130, 246, 0.1); }
        .mode-card.offline:hover { border-color: #f84464; box-shadow: 0 10px 20px rgba(248, 68, 100, 0.1); }
        .mode-card i { font-size: 40px; margin-bottom: 15px; color: #94a3b8; transition: 0.2s; }
        .mode-card:hover i { color: #3b82f6; }
        .mode-card.offline:hover i { color: #f84464; }
        .mode-card h3 { margin: 0 0 10px 0; font-weight: 800; }
        .mode-card p { margin: 0; font-size: 13px; color: #94a3b8; }
        .btn-close-modal { margin-top: 25px; background: none; border: none; color: #94a3b8; font-weight: bold; cursor: pointer; }
        .btn-close-modal:hover { color: #0f172a; text-decoration: underline; }
    </style>
    <script defer th:src="@{/js/game-rewards.js}"></script>
</head>
<body>
    <div class="main-container">
        
        <a th:href="@{/admin}" class="btn-back"><i class="fas fa-arrow-left"></i> Back to Admin Dashboard</a>
        
        <div class="header-actions">
            <h1 style="margin: 0; color: var(--text-primary); font-weight: 900;">Manage Tournaments</h1>
            <button onclick="document.getElementById('modeModal').classList.add('active')" class="btn-create" style="cursor: pointer;"><i class="fas fa-plus"></i> Create Tournament</button>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Status</th>
                        <th>Participants</th>
                        <th>Winner</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="t : ${tournaments}">
                        <td>
                            <strong th:text="${t.name}"></strong><br>
                            <small style="color: #64748b;" th:text="${t.type}"></small>
                        </td>
                        <td><span th:class="'status-badge status-' + ${t.status}" th:text="${t.status}"></span></td>
                        <td th:text="${t.participants.size() + ' / ' + t.maxParticipants}"></td>
                        <td><span th:if="${t.winner != null}" th:text="${t.winner.username}"></span><span th:if="${t.winner == null}">-</span></td>
                        <td>
                            <a th:href="@{/admin/tournaments/{id}/manage(id=${t.id})}" class="btn-action btn-edit"><i class="fas fa-cog"></i> Manage</a>
                        </td>
                    </tr>
                    <tr th:if="${tournaments.isEmpty()}">
                        <td colspan="5" style="text-align: center; padding: 40px; color: #94a3b8;">
                            <i class="fas fa-box-open" style="font-size: 30px; margin-bottom: 10px; display: block;"></i>
                            No tournaments created yet.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <!-- MODE MODAL -->
    <div class="modal-overlay" id="modeModal">
        <div class="mode-modal">
            <h2>Select Tournament Mode</h2>
            <p>What kind of tournament are you hosting?</p>
            
            <div class="mode-options">
                <a th:href="@{/admin/tournaments/create(mode='ONLINE')}" class="mode-card">
                    <i class="fas fa-globe"></i>
                    <h3>Online Battle</h3>
                    <p>Virtual event on the platform</p>
                </a>
                
                <a th:href="@{/admin/tournaments/create(mode='OFFLINE')}" class="mode-card offline">
                    <i class="fas fa-map-marker-alt"></i>
                    <h3>Offline Event</h3>
                    <p>Physical venue with QR tickets</p>
                </a>
            </div>
            
            <button class="btn-close-modal" onclick="document.getElementById('modeModal').classList.remove('active')">Cancel</button>
        </div>
    </div>

</body>
</html>
