<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Page Not Found</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #343a40;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .error-container {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        h1 {
            color: #dc3545;
            font-size: 72px;
            margin: 0;
        }
        h2 {
            font-size: 24px;
            margin-top: 10px;
        }
        p {
            margin-bottom: 20px;
            color: #6c757d;
        }
        a {
            display: inline-block;
            background-color: #0d6efd;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        a:hover {
            background-color: #0b5ed7;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 th:text="${status ?: '404'}">404</h1>
        <h2>Oops! Something went wrong.</h2>
        <p th:text="${error ?: 'The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.'}">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        <a href="/home">Go back to Home</a>
    </div>
</body>
</html>
