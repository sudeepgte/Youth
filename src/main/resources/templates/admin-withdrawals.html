<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Withdrawals | Youthian Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            --text-primary: #0f172a;
            --text-secondary: #334155;
        }
        body { background: var(--bg-gradient) !important; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        .main-container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        
        .btn-back {
            display: inline-flex; align-items: center; gap: 8px; color: #475569; text-decoration: none; font-weight: 700; margin-bottom: 25px; background: white; padding: 10px 20px; border-radius: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.2s;
        }
        .btn-back:hover { transform: translateX(-3px); color: #0f172a; box-shadow: 0 6px 12px rgba(0,0,0,0.08); }
        
        .table-card {
            background: #ffffff; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px;
        }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; padding: 15px 20px; text-align: left; font-weight: 700; color: #475569; font-size: 13px; text-transform: uppercase; border-bottom: 2px solid #e2e8f0; }
        td { padding: 15px 20px; border-bottom: 1px solid #f1f5f9; color: #334155; font-size: 14px; }
        tr:hover { background: #f8fafc; }
        
        .btn-approve { background: #10B981; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; }
        .btn-reject { background: #EF4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; }
        
        .status-badge { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 800; display: inline-block; }
        .status-pending { background: #FEF3C7; color: #D97706; }
        .status-approved { background: #D1FAE5; color: #059669; }
        .status-rejected { background: #FEE2E2; color: #DC2626; }
    </style>
</head>
<body>
    <div class="main-container">
        <a th:href="@{/admin/dashboard}" class="btn-back"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        
        <h2 style="margin-top: 0; color: var(--text-primary); font-weight: 900; margin-bottom: 20px;"><i class="fas fa-money-bill-wave" style="color: #3b82f6;"></i> Pending Withdrawals</h2>
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Amount</th>
                        <th>Details</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="tx : ${pendingWithdrawals}">
                        <td th:text="${tx.user.username}"></td>
                        <td style="font-weight: 800; color: #0f172a;" th:text="${tx.amount}"></td>
                        <td th:text="${tx.description}"></td>
                        <td th:text="${#temporals.format(tx.timestamp, 'MMM dd, HH:mm')}"></td>
                        <td style="display: flex; gap: 8px;">
                            <form th:action="@{/admin/withdrawals/{id}/approve(id=${tx.id})}" method="post">
                                <button type="submit" class="btn-approve">Approve</button>
                            </form>
                            <form th:action="@{/admin/withdrawals/{id}/reject(id=${tx.id})}" method="post">
                                <button type="submit" class="btn-reject">Reject</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(pendingWithdrawals)}">
                        <td colspan="5" style="text-align: center; color: #94a3b8; padding: 30px;">No pending withdrawal requests.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <h2 style="margin-top: 40px; color: var(--text-primary); font-weight: 900; margin-bottom: 20px;"><i class="fas fa-history" style="color: #64748b;"></i> Withdrawal History</h2>
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="tx : ${history}">
                        <td th:text="${tx.user.username}"></td>
                        <td style="font-weight: 800; color: #0f172a;" th:text="${tx.amount}"></td>
                        <td>
                            <span class="status-badge" 
                                  th:classappend="${tx.status == 'APPROVED' ? 'status-approved' : 'status-rejected'}"
                                  th:text="${tx.status}">
                            </span>
                        </td>
                        <td th:text="${#temporals.format(tx.timestamp, 'MMM dd, HH:mm')}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(history)}">
                        <td colspan="4" style="text-align: center; color: #94a3b8; padding: 30px;">No withdrawal history.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
