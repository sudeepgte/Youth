<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Tournament | Youthian Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            --text-primary: #0f172a;
            --text-secondary: #334155;
        }
        body { background: var(--bg-gradient) !important; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        .main-container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        
        .btn-back {
            display: inline-flex; align-items: center; gap: 8px; color: #475569; text-decoration: none; font-weight: 700; margin-bottom: 25px; background: white; padding: 10px 20px; border-radius: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.2s;
        }
        .btn-back:hover { transform: translateX(-3px); color: #0f172a; box-shadow: 0 6px 12px rgba(0,0,0,0.08); }

        .form-card {
            background: #ffffff; border-radius: 20px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 700; color: #334155; margin-bottom: 8px; font-size: 14px; }
        .form-control { width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 14px; font-family: inherit; transition: 0.2s; box-sizing: border-box; }
        .form-control:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        .form-row { display: flex; gap: 20px; }
        .form-row .form-group { flex: 1; }
        
        .btn-submit {
            background: #10B981; color: white; border: none; padding: 15px 30px; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.2s; width: 100%; font-size: 16px; margin-top: 10px;
        }
        .btn-submit:hover { background: #059669; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(16,185,129,0.3); }
        .btn-cancel {
            display: block; text-align: center; color: #64748b; font-weight: 600; text-decoration: none; margin-top: 15px; font-size: 14px;
        }
        .btn-cancel:hover { color: #0f172a; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="main-container">
        <a th:href="@{/admin/tournaments}" class="btn-back"><i class="fas fa-arrow-left"></i> Back to Tournaments</a>

        <div class="form-card">
            <div th:if="${tournament.mode == 'ONLINE'}" style="background: #eff6ff; color: #1e3a8a; padding: 15px 20px; border-radius: 12px; margin-bottom: 25px; font-weight: bold; display: flex; align-items: center; gap: 10px;">
                <i class="fas fa-globe" style="font-size: 24px;"></i> Creating Online Tournament
            </div>
            <div th:if="${tournament.mode == 'OFFLINE'}" style="background: #fff1f2; color: #9f1239; padding: 15px 20px; border-radius: 12px; margin-bottom: 25px; font-weight: bold; display: flex; align-items: center; gap: 10px;">
                <i class="fas fa-map-marker-alt" style="font-size: 24px;"></i> Creating Offline Tournament
            </div>
            
            <form th:action="@{/admin/tournaments/create}" th:object="${tournament}" method="post">
                
                <div class="form-group">
                    <label>Tournament Name</label>
                    <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Summer Code Clash 2026" required />
                </div>

                <div class="form-group">
                    <label>Description & Rules</label>
                    <textarea th:field="*{description}" class="form-control" rows="4" placeholder="Describe the tournament and entry rules..." required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Tournament Type</label>
                        <input type="text" th:field="*{type}" class="form-control" placeholder="e.g. Coding, Dance, Singing" required />
                    </div>
                    <div class="form-group">
                        <label>Max Participants</label>
                        <select th:field="*{maxParticipants}" class="form-control">
                            <option value="4">4 Players</option>
                            <option value="8">8 Players</option>
                            <option value="16">16 Players</option>
                            <option value="32">32 Players</option>
                            <option value="64">64 Players</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Registration Start</label>
                        <input type="datetime-local" th:field="*{registrationStart}" class="form-control" required />
                    </div>
                    <div class="form-group">
                        <label>Registration End</label>
                        <input type="datetime-local" th:field="*{registrationEnd}" class="form-control" required />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Tournament Start</label>
                        <input type="datetime-local" th:field="*{tournamentStart}" class="form-control" required />
                    </div>
                    <div class="form-group">
                        <label>Battle Duration (mins)</label>
                        <input type="number" th:field="*{battleDurationMinutes}" class="form-control" min="1" value="10" required />
                    </div>
                </div>

                <h3 style="margin: 25px 0 15px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px;">Tournament Mode & Settings</h3>
                
                <!-- Hidden Mode Field -->
                <input type="hidden" th:field="*{mode}" id="modeSelect" />

                <!-- OFFLINE SPECIFIC SETTINGS -->
                <div id="offlineSettings" th:style="${tournament.mode == 'OFFLINE' ? 'display: block;' : 'display: none;'}" style="background: #f8fafc; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 20px;">
                    <h4 style="margin: 0 0 15px 0; color: #0f172a;"><i class="fas fa-map-marker-alt" style="color: #8b5cf6;"></i> Physical Venue Details</h4>
                    <div class="form-group">
                        <label>Venue</label>
                        <input type="text" th:field="*{venue}" class="form-control" placeholder="e.g. Koramangala Indoor Stadium" />
                    </div>

                </div>

                <!-- JUDGE SETTINGS -->
                <div class="form-group">
                    <label>Judges (Select users to be judges)</label>
                    <select name="judgeIds" class="form-control" multiple style="height: 120px;">
                        <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.username + ' (' + u.email + ')'}"></option>
                    </select>
                    <small style="color: #64748b;">Hold Ctrl (Windows) or Cmd (Mac) to select multiple judges.</small>
                </div>

                <h3 style="margin: 25px 0 15px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px;">Prize & Economy</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Entry Fee (?)</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{entryFee}" placeholder="0.0">
                    </div>
                    <div class="form-group">
                        <label>Admin Commission (%)</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{adminCommissionPercent}" placeholder="e.g. 10">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>1st Place Prize Split (%)</label>
                        <input type="number" step="0.1" class="form-control" th:field="*{prize1Percent}">
                    </div>
                    <div class="form-group">
                        <label>2nd Place Split (%)</label>
                        <input type="number" step="0.1" class="form-control" th:field="*{prize2Percent}">
                    </div>
                    <div class="form-group">
                        <label>3rd Place Split (%)</label>
                        <input type="number" step="0.1" class="form-control" th:field="*{prize3Percent}">
                    </div>
                </div>
                <div class="form-group">
                    <label>Custom Prizes (Physical/Other)</label>
                    <input type="text" class="form-control" th:field="*{customPrizes}" placeholder="e.g. Trophy, Signed T-Shirt">
                </div>

                <button type="submit" class="btn-submit">Create Tournament</button>
                <a th:href="@{/admin/tournaments}" class="btn-cancel">Cancel and return</a>
            </form>
        </div>
    </div>
    <script>
        function toggleModeSettings() {
            var mode = document.getElementById("modeSelect").value;
            var offlineSettings = document.getElementById("offlineSettings");
            if (mode === "OFFLINE") {
                offlineSettings.style.display = "block";
            } else {
                offlineSettings.style.display = "none";
            }
        }
        // Initialize on load
        document.addEventListener("DOMContentLoaded", toggleModeSettings);
    </script>
</body>
</html>
