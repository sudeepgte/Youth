<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <script>if(localStorage.getItem('youthian_theme')==='dark') document.documentElement.classList.add('dark-theme');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Youthians</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --reg-bg: #f8fafc;
            --reg-card-bg: rgba(255, 255, 255, 0.94);
            --reg-border: #e2e8f0;
            --reg-border-focus: #3b82f6;
            --reg-text-main: #0f172a;
            --reg-text-muted: #64748b;
            --reg-input-bg: #f8fafc;
            --reg-input-focus-bg: #ffffff;
            --reg-error: #ef4444;
            --reg-error-bg: #fef2f2;
            --reg-error-border: #fca5a5;
            --reg-primary-gradient: linear-gradient(135deg, #2563eb 0%, #3b82f6 55%, #06b6d4 100%);
            --reg-shadow: 0 20px 45px -12px rgba(15, 23, 42, 0.08), 0 0 1px 1px rgba(0, 0, 0, 0.04);
        }

        .dark-theme {
            --reg-bg: #090d16;
            --reg-card-bg: rgba(17, 24, 39, 0.92);
            --reg-border: rgba(255, 255, 255, 0.1);
            --reg-text-main: #f8fafc;
            --reg-text-muted: #94a3b8;
            --reg-input-bg: rgba(15, 23, 42, 0.6);
            --reg-input-focus-bg: rgba(15, 23, 42, 0.95);
            --reg-error-bg: rgba(239, 68, 68, 0.12);
            --reg-error-border: rgba(239, 68, 68, 0.3);
            --reg-shadow: 0 24px 50px -12px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--reg-bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--reg-text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 80px 16px 40px;
        }

        .back-nav {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 50;
        }

        .back-nav a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--reg-text-main);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
            background: var(--reg-card-bg);
            backdrop-filter: blur(12px);
            padding: 9px 16px;
            border-radius: 12px;
            border: 1px solid var(--reg-border);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
            transition: all 0.2s ease;
        }

        .back-nav a:hover {
            transform: translateX(-3px);
            color: #2563eb;
            border-color: #bfdbfe;
        }

        .register-card {
            background: var(--reg-card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--reg-border);
            border-radius: 20px;
            box-shadow: var(--reg-shadow);
            width: 100%;
            max-width: 580px;
            padding: 38px 42px;
            transition: all 0.3s ease;
        }

        .register-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: var(--reg-primary-gradient);
            color: #ffffff;
            font-size: 22px;
            margin-bottom: 14px;
            box-shadow: 0 8px 18px -4px rgba(37, 99, 235, 0.4);
        }

        .register-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--reg-text-main);
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        .register-header p {
            font-size: 14px;
            color: var(--reg-text-muted);
            line-height: 1.5;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
        }

        .form-row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--reg-text-main);
            margin-bottom: 7px;
        }

        .form-group label span.req {
            color: var(--reg-error);
            font-weight: 700;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .input-icon-left {
            position: absolute;
            left: 14px;
            color: #94a3b8;
            font-size: 15px;
            pointer-events: none;
            transition: color 0.2s;
            z-index: 2;
        }

        .input-wrapper input,
        .input-wrapper select {
            width: 100%;
            height: 46px;
            padding: 0 14px 0 40px;
            background-color: var(--reg-input-bg);
            border: 1.5px solid var(--reg-border);
            border-radius: 12px;
            color: var(--reg-text-main);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-wrapper input::placeholder {
            color: #94a3b8;
            font-size: 13.5px;
        }

        .input-wrapper select {
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            padding-right: 36px;
        }

        .select-caret {
            position: absolute;
            right: 14px;
            color: #94a3b8;
            pointer-events: none;
            font-size: 13px;
        }

        .input-wrapper input:focus,
        .input-wrapper select:focus {
            background-color: var(--reg-input-focus-bg);
            border-color: var(--reg-border-focus);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
        }

        .input-wrapper:focus-within .input-icon-left {
            color: #3b82f6;
        }

        /* Password Toggle Button */
        .password-toggle-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 6px;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            z-index: 3;
            outline: none;
        }

        .password-toggle-btn:hover {
            color: #3b82f6;
        }

        .input-wrapper.has-toggle input {
            padding-right: 42px;
        }

        /* Field Validation Error Box - Strictly Below Each Input */
        .field-error {
            display: none;
            align-items: center;
            gap: 6px;
            color: var(--reg-error);
            font-size: 12.5px;
            font-weight: 500;
            margin-top: 6px;
            line-height: 1.35;
        }

        .field-error i {
            font-size: 13px;
            flex-shrink: 0;
        }

        /* Error state on input */
        .form-group.has-error .input-wrapper input,
        .form-group.has-error .input-wrapper select {
            border-color: var(--reg-error) !important;
            background-color: var(--reg-error-bg) !important;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15) !important;
        }

        .form-group.has-error .input-icon-left {
            color: var(--reg-error) !important;
        }

        .form-group.has-error .field-error {
            display: flex;
            animation: fadeInError 0.2s ease forwards;
        }

        @keyframes fadeInError {
            from {
                opacity: 0;
                transform: translateY(-3px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Submit Button */
        .btn-submit-register {
            width: 100%;
            height: 48px;
            background: var(--reg-primary-gradient);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 15.5px;
            font-weight: 700;
            letter-spacing: 0.01em;
            cursor: pointer;
            box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.35);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-submit-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px -4px rgba(37, 99, 235, 0.45);
            filter: brightness(1.05);
        }

        .btn-submit-register:active {
            transform: translateY(0);
        }

        /* Footer Link */
        .register-footer {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--reg-border);
            text-align: center;
            font-size: 14px;
            color: var(--reg-text-muted);
        }

        .register-footer a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.2s;
        }

        .register-footer a:hover {
            text-decoration: underline;
            color: #1d4ed8;
        }

        @media (max-width: 640px) {
            body {
                padding: 76px 14px 28px;
            }

            .register-card {
                padding: 28px 20px;
                border-radius: 16px;
            }

            .form-row-2 {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .register-header h1 {
                font-size: 23px;
            }

            .back-nav {
                top: 14px;
                left: 14px;
            }

            .back-nav a {
                padding: 7px 12px;
                font-size: 13px;
            }
        }
    </style>
    <script defer th:src="@{/js/game-rewards.js}"></script>
</head>
<body>

    <div class="back-nav">
        <a th:href="@{/home}">
            <i class="fas fa-arrow-left"></i> Back to Website
        </a>
    </div>

    <div class="register-card">
        <div class="register-header">
            <div class="brand-badge">
                <i class="fas fa-user-plus"></i>
            </div>
            <h1>Create Your Account</h1>
            <p>Join Youthians to connect, showcase skills, and join tournaments.</p>
        </div>

        <form th:action="@{/register}" th:object="${user}" method="post" onsubmit="return validateRegistrationForm(this)" novalidate>
            <div class="form-grid">
                
                <!-- Username -->
                <div class="form-group" id="fg-username" th:classappend="${param.error != null and param.error[0] == 'duplicate'} ? ' has-error' : ''">
                    <label for="username">Username <span class="req">*</span></label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon-left"></i>
                        <input type="text" id="username" th:field="*{username}" placeholder="Choose a unique username" autocomplete="username">
                    </div>
                    <div class="field-error" id="error-username">
                        <i class="fas fa-circle-exclamation"></i>
                        <span id="text-username" th:text="${param.error != null and param.error[0] == 'duplicate'} ? 'Username already exists. Please choose another.' : ''"></span>
                    </div>
                </div>

                <!-- Email -->
                <div class="form-group" id="fg-email" th:classappend="${param.error != null and (param.error[0] == 'duplicate_email' or param.error[0] == 'invalid_email_domain')} ? ' has-error' : ''">
                    <label for="email">Email Address <span class="req">*</span></label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon-left"></i>
                        <input type="email" id="email" th:field="*{email}" placeholder="name@domain.com" autocomplete="email">
                    </div>
                    <div class="field-error" id="error-email">
                        <i class="fas fa-circle-exclamation"></i>
                        <span id="text-email" th:text="${param.error != null and param.error[0] == 'duplicate_email'} ? 'This email is already in use.' : (${param.error != null and param.error[0] == 'invalid_email_domain'} ? 'Please enter a valid email address.' : '')"></span>
                    </div>
                </div>

                <!-- College / Institution Name -->
                <div class="form-group" id="fg-collegeName">
                    <label for="collegeName">College / Institution Name <span class="req">*</span></label>
                    <div class="input-wrapper">
                        <i class="fas fa-university input-icon-left"></i>
                        <input type="text" id="collegeName" th:field="*{collegeName}" placeholder="e.g. IIT Bombay, VTU, Christ University">
                    </div>
                    <div class="field-error" id="error-collegeName">
                        <i class="fas fa-circle-exclamation"></i>
                        <span id="text-collegeName"></span>
                    </div>
                </div>

                <!-- Date of Birth & Gender in 2 columns -->
                <div class="form-row-2">
                    <!-- Date of Birth -->
                    <div class="form-group" id="fg-dob" th:classappend="${param.error != null and (param.error[0] == 'underage' or param.error[0] == 'future_dob')} ? ' has-error' : ''">
                        <label for="dob">Date of Birth <span class="req">*</span></label>
                        <div class="input-wrapper">
                            <i class="fas fa-calendar-alt input-icon-left"></i>
                            <input type="date" id="dob" th:field="*{dob}">
                        </div>
                        <div class="field-error" id="error-dob">
                            <i class="fas fa-circle-exclamation"></i>
                            <span id="text-dob" th:text="${param.error != null and param.error[0] == 'underage'} ? 'Age must be greater than 16 years old to register.' : (${param.error != null and param.error[0] == 'future_dob'} ? 'Date of Birth cannot be in the future.' : '')"></span>
                        </div>
                    </div>

                    <!-- Gender -->
                    <div class="form-group" id="fg-gender">
                        <label for="gender">Gender <span class="req">*</span></label>
                        <div class="input-wrapper">
                            <i class="fas fa-venus-mars input-icon-left"></i>
                            <select id="gender" th:field="*{gender}">
                                <option value="" disabled selected>Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                            <i class="fas fa-chevron-down select-caret"></i>
                        </div>
                        <div class="field-error" id="error-gender">
                            <i class="fas fa-circle-exclamation"></i>
                            <span id="text-gender"></span>
                        </div>
                    </div>
                </div>

                <!-- Password & Confirm Password in 2 columns -->
                <div class="form-row-2">
                    <!-- Password -->
                    <div class="form-group" id="fg-password" th:classappend="${param.error != null and param.error[0] == 'weak_password'} ? ' has-error' : ''">
                        <label for="password">Password <span class="req">*</span></label>
                        <div class="input-wrapper has-toggle">
                            <i class="fas fa-lock input-icon-left"></i>
                            <input type="password" id="password" th:field="*{password}" placeholder="Min. 8 characters" autocomplete="new-password">
                            <button type="button" class="password-toggle-btn" id="togglePassword" aria-label="Toggle password visibility">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="field-error" id="error-password">
                            <i class="fas fa-circle-exclamation"></i>
                            <span id="text-password" th:text="${param.error != null and param.error[0] == 'weak_password'} ? 'Password must be strong (8+ chars, uppercase, lowercase, number, special char).' : ''"></span>
                        </div>
                    </div>

                    <!-- Confirm Password -->
                    <div class="form-group" id="fg-confirmPassword" th:classappend="${param.error != null and param.error[0] == 'password_mismatch'} ? ' has-error' : ''">
                        <label for="confirmPassword">Confirm Password <span class="req">*</span></label>
                        <div class="input-wrapper has-toggle">
                            <i class="fas fa-shield-alt input-icon-left"></i>
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" autocomplete="new-password">
                            <button type="button" class="password-toggle-btn" id="toggleConfirmPassword" aria-label="Toggle confirm password visibility">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="field-error" id="error-confirmPassword">
                            <i class="fas fa-circle-exclamation"></i>
                            <span id="text-confirmPassword" th:text="${param.error != null and param.error[0] == 'password_mismatch'} ? 'Passwords do not match.' : ''"></span>
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit-register">
                    <span>Create Account</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </form>

        <div class="register-footer">
            Already have an account? <a th:href="@{/login}">Sign In</a>
        </div>
    </div>

<script>
    // Visibility toggle helper
    function setupPasswordToggle(buttonId, inputId) {
        const btn = document.getElementById(buttonId);
        const input = document.getElementById(inputId);
        if (!btn || !input) return;

        btn.addEventListener('click', function(e) {
            e.preventDefault();
            const icon = this.querySelector('i');
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            if (isPassword) {
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
    }

    // Set error on specific field below its box
    function setFieldError(fieldId, message) {
        const group = document.getElementById('fg-' + fieldId);
        const textSpan = document.getElementById('text-' + fieldId);
        if (group && textSpan) {
            textSpan.textContent = message;
            group.classList.add('has-error');
        }
    }

    // Clear error for specific field
    function clearFieldError(fieldId) {
        const group = document.getElementById('fg-' + fieldId);
        const textSpan = document.getElementById('text-' + fieldId);
        if (group && textSpan) {
            group.classList.remove('has-error');
            textSpan.textContent = '';
        }
    }

    // Clear all field errors
    function clearAllErrors() {
        document.querySelectorAll('.form-group').forEach(function(group) {
            group.classList.remove('has-error');
        });
        document.querySelectorAll('.field-error span').forEach(function(span) {
            span.textContent = '';
        });
    }

    // Form submission validation
    function validateRegistrationForm(form) {
        clearAllErrors();
        let isValid = true;
        let firstInvalidInput = null;

        function markInvalid(fieldId, inputElem, message) {
            setFieldError(fieldId, message);
            if (!firstInvalidInput && inputElem) {
                firstInvalidInput = inputElem;
            }
            isValid = false;
        }

        // 1. Username
        const usernameInput = form.username;
        const username = usernameInput ? usernameInput.value.trim() : '';
        if (!username) {
            markInvalid('username', usernameInput, 'Username is required.');
        } else if (!/^[a-zA-Z0-9_ -]+$/.test(username)) {
            markInvalid('username', usernameInput, 'Letters, numbers, spaces, underscores, and hyphens only.');
        } else if (!/[a-zA-Z0-9]/.test(username)) {
            markInvalid('username', usernameInput, 'Username must contain at least one letter or number.');
        }

        // 2. Email
        const emailInput = form.email;
        const email = emailInput ? emailInput.value.trim() : '';
        const emailRegex = /^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$/;
        if (!email) {
            markInvalid('email', emailInput, 'Email address is required.');
        } else if (!emailRegex.test(email)) {
            markInvalid('email', emailInput, 'Please enter a valid email address (e.g. name@domain.com).');
        }

        // 3. College / Institution Name
        const collegeInput = form.collegeName;
        const college = collegeInput ? collegeInput.value.trim() : '';
        if (!college) {
            markInvalid('collegeName', collegeInput, 'College / Institution name is required.');
        } else if (!/[a-zA-Z]/.test(college)) {
            markInvalid('collegeName', collegeInput, 'College name must contain letters.');
        }

        // 4. Date of Birth
        const dobInput = form.dob;
        const dobValue = dobInput ? dobInput.value : '';
        if (!dobValue) {
            markInvalid('dob', dobInput, 'Please select your Date of Birth.');
        } else {
            const dobDate = new Date(dobValue);
            const today = new Date();
            let age = today.getFullYear() - dobDate.getFullYear();
            const m = today.getMonth() - dobDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < dobDate.getDate())) {
                age--;
            }
            if (age <= 16) {
                markInvalid('dob', dobInput, 'Age must be greater than 16 years old to register.');
            } else if (age > 100) {
                markInvalid('dob', dobInput, 'Please enter a realistic date of birth (max 100 years).');
            }
        }

        // 5. Gender
        const genderInput = form.gender;
        if (!genderInput || !genderInput.value) {
            markInvalid('gender', genderInput, 'Please select your gender.');
        }

        // 6. Password
        const passwordInput = form.password;
        const password = passwordInput ? passwordInput.value : '';
        const strongPwdRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
        if (!password) {
            markInvalid('password', passwordInput, 'Password is required.');
        } else if (!strongPwdRegex.test(password)) {
            markInvalid('password', passwordInput, 'Password must be 8+ chars with uppercase, lowercase, number, and special character (@$!%*?&).');
        }

        // 7. Confirm Password
        const confirmInput = form.confirmPassword;
        const confirmPassword = confirmInput ? confirmInput.value : '';
        if (!confirmPassword) {
            markInvalid('confirmPassword', confirmInput, 'Please confirm your password.');
        } else if (password !== confirmPassword) {
            markInvalid('confirmPassword', confirmInput, 'Passwords do not match.');
        }

        if (!isValid && firstInvalidInput) {
            firstInvalidInput.focus();
        }

        return isValid;
    }

    document.addEventListener("DOMContentLoaded", function() {
        // Enforce max date picker limit strictly (> 16 years ago)
        const today = new Date();
        const maxLimit = new Date(today.getFullYear() - 16, today.getMonth(), today.getDate() - 1);
        const maxDate = maxLimit.toISOString().split('T')[0];
        const minDate = new Date(today.getFullYear() - 100, today.getMonth(), today.getDate()).toISOString().split('T')[0];
        const dobInput = document.getElementById("dob");
        if (dobInput) {
            dobInput.setAttribute("max", maxDate);
            dobInput.setAttribute("min", minDate);
        }

        // Attach password visibility toggles
        setupPasswordToggle('togglePassword', 'password');
        setupPasswordToggle('toggleConfirmPassword', 'confirmPassword');

        // Real-time error dismissal on typing or change
        const fieldIds = ['username', 'email', 'collegeName', 'dob', 'gender', 'password', 'confirmPassword'];
        fieldIds.forEach(function(id) {
            const input = document.getElementById(id);
            if (input) {
                input.addEventListener('input', function() {
                    clearFieldError(id);
                });
                input.addEventListener('change', function() {
                    clearFieldError(id);
                });
            }
        });
    });
</script>
